[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reach-guard"
version = "0.1.1"
description = "Strict-mode enforcement wrapper for agent-reach and upstream binaries (serial lock, pacing, quota, proxy binding, circuit breaker)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
reach-guard = "reach_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
